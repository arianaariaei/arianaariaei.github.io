<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Name — Transcript</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <script>
    (async function(){
      const t=document.getElementById('nav');
      try{
        const res=await fetch('./assets/nav.html',{cache:'no-store'});
        t.innerHTML=await res.text();
        (document.getElementById('nav-transcript')||{}).setAttribute?.('aria-current','page');
      }catch(e){console.error(e)}
    })();
  </script>

  <main class="container">
    <header class="card">
      <h1>Academic Transcript</h1>
      <p class="meta">Download: <a class="btn" href="./docs/transcript.pdf">transcript.pdf</a></p>
    </header>

    <section class="card">
      <h2>Summary</h2>
      <p>Program; expected graduation; cumulative GPA (optional); honors.</p>
    </section>

    <section class="card">
      <h2>Inline preview</h2>
      <iframe title="Transcript PDF preview" src="./docs/transcript.pdf" width="100%" height="820" style="border:1px solid #ddd;border-radius:8px;"></iframe>
    </section>
  </main>

  <footer><div class="container">© <span id="y"></span> Your Name</div></footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
